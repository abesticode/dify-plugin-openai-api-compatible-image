<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes float {
      0%, 100% { transform: rotate(-8deg) translateY(0px); }
      50% { transform: rotate(-8deg) translateY(-2px); }
    }
    @keyframes starPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.7; }
    }
    @keyframes sunPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.9; }
    }
    .anim-float {
      transform-origin: 17px 18px;
      animation: float 3s ease-in-out infinite;
    }
    .anim-star1 {
      transform-origin: 31px 10px;
      animation: starPulse 2s ease-in-out infinite;
    }
    .anim-star2 {
      transform-origin: 9px 28px;
      animation: starPulse 2.5s ease-in-out infinite 1s;
    }
    .anim-sun {
      transform-origin: 25.5px 17px;
      animation: sunPulse 4s ease-in-out infinite;
    }
  </style>

  <!-- Base background gradient -->
  <rect width="40" height="40" rx="10" fill="url(#bg_grad)" />
  
  <!-- Outer Glow / Inner Shadow effect -->
  <rect x="0.5" y="0.5" width="39" height="39" rx="9.5" stroke="white" stroke-opacity="0.25" stroke-width="1"/>
  
  <!-- Layer 1: Back Photo Frame (Translucent Glassmorphism) -->
  <rect class="anim-float" x="7" y="10" width="20" height="16" rx="3.5" fill="white" fill-opacity="0.2" stroke="white" stroke-opacity="0.6" stroke-width="1.2"/>
  
  <!-- Layer 2: Main Photo Frame -->
  <rect x="10" y="12" width="22" height="18" rx="3.5" fill="url(#card_grad)" stroke="white" stroke-width="1.5"/>
  
  <!-- Content inside Main Frame -->
  <clipPath id="frame_clip">
    <rect x="10" y="12" width="22" height="18" rx="3.5"/>
  </clipPath>
  
  <g clip-path="url(#frame_clip)">
    <!-- Sun -->
    <circle class="anim-sun" cx="25.5" cy="17" r="3.5" fill="url(#sun_grad)"/>
    
    <!-- Mountains -->
    <path d="M5 28 L14 17.5 L20 24.5 L26 18.5 L34 28 Z" fill="url(#mountain_grad)"/>
    <path d="M14 29 L23 19.5 L33 30 Z" fill="url(#mountain_grad2)" fill-opacity="0.9"/>
  </g>
  
  <!-- Magic Star Top Right -->
  <path class="anim-star1" d="M31 6 C31 8 33 10 35 10 C33 10 31 12 31 14 C31 12 29 10 27 10 C29 10 31 8 31 6 Z" fill="url(#star_grad)"/>
  
  <!-- Magic Star Bottom Left -->
  <path class="anim-star2" d="M9 25 C9 26.5 10.5 28 12 28 C10.5 28 9 29.5 9 31 C9 29.5 7.5 28 6 28 C7.5 28 9 26.5 9 25 Z" fill="white" fill-opacity="0.9"/>

  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="40" y2="40">
      <stop offset="0%" stop-color="#2DD4BF"/> <!-- Teal -->
      <stop offset="50%" stop-color="#3B82F6"/> <!-- Blue -->
      <stop offset="100%" stop-color="#9333EA"/> <!-- Purple -->
    </linearGradient>
    <linearGradient id="card_grad" x1="10" y1="12" x2="32" y2="30">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="sun_grad" x1="22" y1="13.5" x2="29" y2="20.5">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="mountain_grad" x1="5" y1="17.5" x2="34" y2="28">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="mountain_grad2" x1="14" y1="19.5" x2="33" y2="30">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="star_grad" x1="27" y1="6" x2="35" y2="14">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
  </defs>
</svg>
