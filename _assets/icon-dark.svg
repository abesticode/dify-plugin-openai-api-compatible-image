<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes float {
      0%, 100% { transform: rotate(-8deg) translateY(0px); }
      50% { transform: rotate(-8deg) translateY(-2px); }
    }
    @keyframes starPulse {
      0%, 100% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 2px rgba(253,224,71,0.8)); }
      50% { transform: scale(1.2); opacity: 0.8; filter: drop-shadow(0 0 4px rgba(253,224,71,1)); }
    }
    @keyframes starPulseBlue {
      0%, 100% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 2px rgba(56,189,248,0.8)); }
      50% { transform: scale(1.15); opacity: 0.8; filter: drop-shadow(0 0 4px rgba(56,189,248,1)); }
    }
    @keyframes sunPulse {
      0%, 100% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 2px rgba(244,114,182,0.5)); }
      50% { transform: scale(1.1); opacity: 0.9; filter: drop-shadow(0 0 4px rgba(244,114,182,0.8)); }
    }
    .anim-float {
      transform-origin: 17px 18px;
      animation: float 4s ease-in-out infinite;
    }
    .anim-star1 {
      transform-origin: 31px 10px;
      animation: starPulse 2.5s ease-in-out infinite;
    }
    .anim-star2 {
      transform-origin: 8px 28px;
      animation: starPulseBlue 3s ease-in-out infinite 1s;
    }
    .anim-sun {
      transform-origin: 25.5px 17px;
      animation: sunPulse 4s ease-in-out infinite;
    }
  </style>

  <!-- Base dark background gradient -->
  <rect width="40" height="40" rx="10" fill="url(#dark_bg_grad)" />
  
  <!-- Outer Neon Glow Border -->
  <rect x="0.5" y="0.5" width="39" height="39" rx="9.5" stroke="url(#border_grad)" stroke-opacity="0.45" stroke-width="1"/>
  
  <!-- Layer 1: Back Photo Frame (Translucent Outline) -->
  <rect class="anim-float" x="7" y="10" width="20" height="16" rx="3.5" fill="none" stroke="url(#back_stroke)" stroke-opacity="0.7" stroke-width="1.2"/>
  
  <!-- Layer 2: Main Photo Frame -->
  <rect x="10" y="12" width="22" height="18" rx="3.5" fill="url(#card_grad)" stroke="url(#main_stroke)" stroke-width="1.5"/>
  
  <clipPath id="frame_clip_dark">
    <rect x="10" y="12" width="22" height="18" rx="3.5"/>
  </clipPath>
  
  <g clip-path="url(#frame_clip_dark)">
    <!-- Sun -->
    <circle class="anim-sun" cx="25.5" cy="17" r="3.5" fill="url(#sun_grad_dark)"/>
    
    <!-- Mountains -->
    <path d="M5 28 L14 17.5 L20 24.5 L26 18.5 L34 28 Z" fill="url(#mountain_grad_dark)"/>
    <path d="M14 29 L23 19.5 L33 30 Z" fill="url(#mountain_grad2_dark)" fill-opacity="0.95"/>
  </g>
  
  <!-- Magic Star Top Right -->
  <path class="anim-star1" d="M31 6 C31 8 33 10 35 10 C33 10 31 12 31 14 C31 12 29 10 27 10 C29 10 31 8 31 6 Z" fill="url(#star_grad_dark)"/>
  
  <!-- Magic Star Bottom Left -->
  <path class="anim-star2" d="M8 25 C8 26.5 9.5 28 11 28 C9.5 28 8 29.5 8 31 C8 29.5 6.5 28 5 28 C6.5 28 8 26.5 8 25 Z" fill="#38BDF8"/>

  <defs>
    <linearGradient id="dark_bg_grad" x1="0" y1="0" x2="40" y2="40">
      <stop offset="0%" stop-color="#0F172A"/> <!-- Slate 900 -->
      <stop offset="50%" stop-color="#1E1B4B"/> <!-- Indigo 950 -->
      <stop offset="100%" stop-color="#3B0764"/> <!-- Purple 950 -->
    </linearGradient>
    <linearGradient id="border_grad" x1="0" y1="0" x2="40" y2="40">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="back_stroke" x1="7" y1="10" x2="27" y2="26">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="card_grad" x1="10" y1="12" x2="32" y2="30">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="main_stroke" x1="10" y1="12" x2="32" y2="30">
      <stop offset="0%" stop-color="#E879F9"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="sun_grad_dark" x1="22" y1="13.5" x2="29" y2="20.5">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="mountain_grad_dark" x1="5" y1="17.5" x2="34" y2="28">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="mountain_grad2_dark" x1="14" y1="19.5" x2="33" y2="30">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="star_grad_dark" x1="27" y1="6" x2="35" y2="14">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
  </defs>
</svg>
